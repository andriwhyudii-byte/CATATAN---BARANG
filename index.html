<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Barang</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6feb">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#fff;--fg:#1f2328;--mut:#6b7280;--line:#d0d7de;--head:#eef1f4;--calc:#f6f8fa;--pos:#1a7f37;--neg:#cf222e;--gs:#8c959f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--fg:#e6edf3;--mut:#8b949e;--line:#30363d;--head:#161b22;--calc:#12171e;--pos:#3fb950;--neg:#f85149;--gs:#6e7681;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--fg:#e6edf3;--mut:#8b949e;--line:#30363d;--head:#161b22;--calc:#12171e;--pos:#3fb950;--neg:#f85149;--gs:#6e7681;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:18px;margin:12px 12px 2px}
p.h{margin:0 12px 10px;color:var(--mut);font-size:12px}
.wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;min-width:860px;width:100%}
th,td{border:1px solid var(--line);padding:0}
th{background:var(--head);font-size:12px;text-align:left;padding:7px 6px;position:sticky;top:0;z-index:1}
td.no{width:34px;text-align:center;color:var(--mut);font-size:12px;background:var(--head)}
td input{width:100%;box-sizing:border-box;border:0;background:transparent;color:inherit;font:inherit;padding:8px 6px;outline:none}
td input:focus{box-shadow:inset 0 0 0 2px #2f81f7;background:var(--bg)}
td input.n{text-align:right}
td.calc{background:var(--calc);text-align:right;padding:8px 6px;white-space:nowrap}
td.laba.pos{color:var(--pos);font-weight:600}
td.laba.neg{color:var(--neg);font-weight:600}
tr.gs td{border-top:2px solid var(--gs)}
td.x{width:64px;text-align:center}
button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--mut);padding:8px 6px;cursor:pointer}
button.ask{color:var(--neg);font-weight:600}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 12px 10px;font-size:12px;color:var(--mut)}
.bar button{border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:5px 9px}
</style>
</head>
<body>
<h1>Catatan Barang</h1>
<p class="h">Modal ÷ isi = modal per pcs · Harga jual − modal per pcs = laba per pcs · Enter = kolom berikutnya</p>
<div class="bar"><span id="st">Tersimpan di perangkat ini</span><button id="bk" type="button" hidden>Unduh cadangan (CSV)</button><button id="rs" type="button">Pulihkan dari CSV</button><input id="rf" type="file" accept=".csv,text/csv,text/plain" hidden></div>
<div class="wrap">
<table>
<thead><tr><th>#</th><th>Nama Barang</th><th>Kategori</th><th>Modal</th><th>Isi</th><th>Modal / pcs</th><th>Harga Jual</th><th>Laba</th><th></th></tr></thead>
<tbody id="tb"></tbody>
</table>
</div>
<datalist id="kats"></datalist>
<script>
(function(){
var KEY='catatan-barang-v1';
var F=['nama','kat','modal','isi','harga'];
var NUM={modal:1,isi:1,harga:1};
var rows=[],uid=1;
var tb=document.getElementById('tb');
var dl=document.getElementById('kats');

function blank(){return {id:uid++,nama:'',kat:'',modal:'',isi:'',harga:''};}
function isBlank(r){return F.every(function(f){return !String(r[f]).trim();});}
function norm(s){return String(s||'').trim().toLowerCase();}
function num(s){s=String(s);if(s==='')return null;var n=Number(s.replace(',','.'));return isFinite(n)?n:null;}
function r2(x){return Math.round(x*100)/100;}
function fmt(n,d){return n.toLocaleString('id-ID',{maximumFractionDigits:d==null?2:d});}
function fmtRaw(s){var n=num(s);return n===null?s:fmt(n,6)+(/,$/.test(s)?',':'');}
var stamp=0,cloudTimer=null,dbDoc=null,statusEl=null;
function fromList(a){
  var out=[];
  if(Array.isArray(a))a.forEach(function(x){
    if(!x||typeof x!=='object')return;
    var r=blank();F.forEach(function(f){r[f]=x[f]==null?'':String(x[f]);});out.push(r);
  });
  return out;
}
function plain(){
  return rows.filter(function(r){return !isBlank(r);}).map(function(r){return {nama:r.nama,kat:r.kat,modal:r.modal,isi:r.isi,harga:r.harga};});
}
function load(){
  try{
    var s=localStorage.getItem(KEY);
    if(s){var a=JSON.parse(s);
      var list=Array.isArray(a)?a:(a&&a.rows);
      stamp=(a&&!Array.isArray(a)&&Number(a.t))||0;
      rows=fromList(list);
    }
  }catch(e){}
}
function setStatus(t){if(statusEl)statusEl.textContent=t;}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify({t:stamp,rows:plain()}));}catch(e){}}
function save(){
  stamp=Date.now();
  saveLocal();
  if(dbDoc){setStatus('Menyimpan…');clearTimeout(cloudTimer);cloudTimer=setTimeout(pushCloud,800);}
}
function pushCloud(){
  var snap={t:stamp,rows:plain()};
  dbDoc.set(snap).then(function(){setStatus('Tersimpan di akun ✓');}).catch(function(){setStatus('Gagal simpan ke akun, tersimpan di perangkat ini saja');});
}
function hasData(){return rows.some(function(r){return !isBlank(r);});}
function connectCloud(){
  if(!window.claude||!window.claude.use)return;
  Promise.all([claude.use('user'),claude.use('db')]).then(function(a){
    var user=a[0],db=a[1];
    if(!user||!db||!user.id)return;
    return user.id().then(function(id){
      if(!id)return;
      var d=db.doc('data/users/'+id+'/barang');
      return d.get().then(function(snap){
        dbDoc=d;
        var c=snap.exists?snap.data():null;
        var ct=c?(Number(c.t)||0):-1;
        if(c&&Array.isArray(c.rows)&&ct>stamp){
          rows=fromList(c.rows);stamp=ct;saveLocal();
          tb.innerHTML='';rows.forEach(function(r){tb.appendChild(makeRow(r));});
          ensureBlank();refresh();setStatus('Tersimpan di akun ✓');
        }else if(stamp>ct&&hasData()){
          pushCloud();setStatus('Menyimpan…');
        }else{setStatus('Tersimpan di akun ✓');}
      });
    });
  }).catch(function(){dbDoc=null;});
}
function csvCell(v){return '"'+String(v).replace(/"/g,'""')+'"';}
function backup(){
  (window.claude&&window.claude.use?claude.use('downloads'):Promise.resolve(null)).then(function(dl){
    var lines=[['Nama Barang','Kategori','Modal','Isi','Modal per pcs','Harga Jual','Laba'].map(csvCell).join(';')];
    rows.forEach(function(r){
      if(isBlank(r))return;
      var c=calc(r);
      lines.push([r.nama,r.kat,r.modal,r.isi,c.mpp===null?'':String(c.mpp).replace('.',','),r.harga,c.laba===null?'':String(c.laba).replace('.',',')].map(csvCell).join(';'));
    });
    var data='\ufeff'+lines.join('\r\n');
    if(dl)return dl.save({filename:'catatan-barang.csv',data:data});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));
    a.download='catatan-barang.csv';
    document.body.appendChild(a);a.click();a.remove();
  }).catch(function(){});
}
function calc(r){
  var m=num(r.modal),i=num(r.isi),h=num(r.harga);
  var mpp=(m!==null&&i!==null&&i>0)?r2(m/i):null;
  var laba=(mpp!==null&&h!==null)?r2(h-m/i):null;
  return {mpp:mpp,laba:laba};
}
function paint(tr,r){
  var c=calc(r);
  tr.querySelector('.mpp').textContent=c.mpp===null?'':fmt(c.mpp);
  var l=tr.querySelector('.laba');
  l.textContent=c.laba===null?'':fmt(c.laba);
  l.className='calc laba'+(c.laba===null?'':(c.laba<0?' neg':(c.laba>0?' pos':'')));
}
function makeRow(r){
  var tr=document.createElement('tr');tr.dataset.id=r.id;
  function inp(f){return '<td><input data-f="'+f+'" autocomplete="off"'+(f==='kat'?' list="kats"':'')+(NUM[f]?' class="n" inputmode="decimal"':'')+'></td>';}
  tr.innerHTML='<td class="no"></td>'+inp('nama')+inp('kat')+inp('modal')+inp('isi')+
    '<td class="calc mpp"></td>'+inp('harga')+'<td class="calc laba"></td><td class="x"><button type="button" data-del="1">Hapus</button></td>';
  F.forEach(function(f){
    var el=tr.querySelector('[data-f="'+f+'"]');
    el.value=NUM[f]?fmtRaw(r[f]):r[f];
  });
  paint(tr,r);
  return tr;
}
function rowOf(tr){var id=Number(tr.dataset.id);for(var i=0;i<rows.length;i++)if(rows[i].id===id)return rows[i];return null;}
function trOf(r){return tb.querySelector('tr[data-id="'+r.id+'"]');}
function ensureBlank(){
  if(rows.length===0||!isBlank(rows[rows.length-1])){var r=blank();rows.push(r);tb.appendChild(makeRow(r));}
}
function refresh(){
  var trs=tb.children,prev='';
  for(var i=0;i<trs.length;i++){
    trs[i].querySelector('.no').textContent=i+1;
    var r=rowOf(trs[i]);var k=r?norm(r.kat):'';
    trs[i].classList.toggle('gs',i>0&&k!==''&&k!==prev);
    if(k!=='')prev=k;
  }
  var seen={},html='';
  rows.forEach(function(r){var t=r.kat.trim(),k=norm(t);if(k&&!seen[k]){seen[k]=1;var o=document.createElement('option');o.value=t;html+=o.outerHTML;}});
  dl.innerHTML=html;
}
// Pindahkan baris ke bawah baris terakhir yang kategorinya sama
function commitCat(tr){
  var r=rowOf(tr);if(!r)return;
  r.kat=r.kat.trim();
  var k=norm(r.kat);
  if(!k){save();refresh();return;}
  var idx=rows.indexOf(r);
  var rest=rows.filter(function(x){return x!==r;});
  var L=-1,spell=null;
  for(var j=0;j<rest.length;j++){if(norm(rest[j].kat)===k){L=j;if(spell===null)spell=rest[j].kat.trim();}}
  if(L<0){save();refresh();return;}
  if(spell!==null&&r.kat!==spell){r.kat=spell;tr.querySelector('[data-f="kat"]').value=spell;}
  var newIdx=L+1;
  if(newIdx!==idx){
    rows=rest;rows.splice(newIdx,0,r);
    var next=rows[newIdx+1];
    var ref=next?trOf(next):null;
    tb.insertBefore(tr,ref);
  }
  ensureBlank();save();refresh();
}
function focusCell(tr,f){
  if(!tr)return;var el=tr.querySelector('[data-f="'+f+'"]');if(el){el.focus();}
}

tb.addEventListener('input',function(e){
  var el=e.target;if(!el.dataset||!el.dataset.f)return;
  var tr=el.closest('tr'),r=rowOf(tr);if(!r)return;
  var f=el.dataset.f,v=el.value;
  if(NUM[f]){
    v=v.replace(/[^\d,]/g,'');
    var p=v.indexOf(',');if(p>=0)v=v.slice(0,p+1)+v.slice(p+1).replace(/,/g,'');
    if(v!==el.value)el.value=v;
  }
  r[f]=v;
  paint(tr,r);
  ensureBlank();save();
});
tb.addEventListener('focusin',function(e){
  var el=e.target;if(!el.dataset||!el.dataset.f)return;
  if(NUM[el.dataset.f]){var r=rowOf(el.closest('tr'));if(r)el.value=r[el.dataset.f];}
  setTimeout(function(){try{el.select();}catch(x){}},0);
});
tb.addEventListener('focusout',function(e){
  var el=e.target;if(!el.dataset||!el.dataset.f)return;
  var tr=el.closest('tr');if(!tr||!tr.parentNode)return;
  var f=el.dataset.f,r=rowOf(tr);if(!r)return;
  if(NUM[f])el.value=fmtRaw(r[f]);
  if(f==='kat')commitCat(tr);
});
tb.addEventListener('keydown',function(e){
  var el=e.target;if(!el.dataset||!el.dataset.f)return;
  var tr=el.closest('tr'),f=el.dataset.f,ci=F.indexOf(f);
  if(e.key==='Enter'){
    e.preventDefault();
    if(f==='kat')commitCat(tr);
    if(ci<F.length-1){focusCell(tr,F[ci+1]);}
    else{
      ensureBlank();
      var nx=tr.nextElementSibling;
      focusCell(nx,'nama');
    }
  }else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    var t=e.key==='ArrowDown'?tr.nextElementSibling:tr.previousElementSibling;
    if(t){e.preventDefault();focusCell(t,f);}
  }
});
tb.addEventListener('click',function(e){
  var b=e.target.closest('button[data-del]');if(!b)return;
  var tr=b.closest('tr'),r=rowOf(tr);if(!r)return;
  if(b.dataset.ask){
    clearTimeout(b._t);
    rows=rows.filter(function(x){return x!==r;});
    tr.remove();ensureBlank();save();refresh();
  }else{
    b.dataset.ask='1';b.textContent='Yakin?';b.className='ask';
    b._t=setTimeout(function(){delete b.dataset.ask;b.textContent='Hapus';b.className='';},2500);
  }
});

statusEl=document.getElementById('st');
load();
rows.forEach(function(r){tb.appendChild(makeRow(r));});
ensureBlank();
refresh();
var bk=document.getElementById('bk');bk.hidden=false;bk.addEventListener('click',backup);
connectCloud();

function parseCSV(t){
  t=t.replace(/^\ufeff/,'');
  var d=(t.split(/\r?\n/)[0]||'').indexOf(';')>=0?';':',';
  var out=[],row=[],f='',q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===d){row.push(f);f='';}
    else if(c==='\n'){row.push(f);out.push(row);row=[];f='';}
    else if(c!=='\r')f+=c;
  }
  if(f!==''||row.length){row.push(f);out.push(row);}
  return out;
}
function cleanNum(v){v=String(v||'').replace(/[^\d,]/g,'');var p=v.indexOf(',');if(p>=0)v=v.slice(0,p+1)+v.slice(p+1).replace(/,/g,'');return v;}
function restore(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var tbl=parseCSV(String(rd.result)).slice(1),list=[];
      tbl.forEach(function(c){
        var o={nama:(c[0]||'').trim(),kat:(c[1]||'').trim(),modal:cleanNum(c[2]),isi:cleanNum(c[3]),harga:cleanNum(c[5])};
        if(o.nama||o.kat||o.modal||o.isi||o.harga)list.push(o);
      });
      if(!list.length){alert('Tidak ada data yang bisa dibaca dari file ini.');return;}
      if(hasData()&&!confirm('Data sekarang akan diganti dengan isi file ('+list.length+' baris). Lanjut?'))return;
      rows=fromList(list);
      tb.innerHTML='';rows.forEach(function(r){tb.appendChild(makeRow(r));});
      ensureBlank();refresh();save();
    }catch(e){alert('File tidak bisa dibaca.');}
  };
  rd.readAsText(file);
}
var rf=document.getElementById('rf');
document.getElementById('rs').addEventListener('click',function(){rf.click();});
rf.addEventListener('change',function(){if(rf.files&&rf.files[0])restore(rf.files[0]);rf.value='';});
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){});}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
</body>
</html>
